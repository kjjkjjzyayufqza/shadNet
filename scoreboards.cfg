#Syntax is communication_id|board_ids|rank_limit|update_mode|sort_mode|upload_num_limit|upload_size_limit
#board_ids can be multiple board ids separated by a comma
#update_mode values:
#NORMAL_UPDATE
#FORCE_UPDATE
#sort_mode values:
#DESCENDING_ORDER
#ASCENDING_ORDER

#Sonic Mania
NPWR12997_00|1,6|100|NORMAL_UPDATE|ASCENDING_ORDER|10|6000000

#Gravity Rush Remastered
NPWR07915_00|1,3,4,5,7,9,11,12,15,16,17,18,20,23,24,25|100|NORMAL_UPDATE|ASCENDING_ORDER|10|6000000

# GUNDAM VERSUS (CUSA08379) and MOBILE SUIT GUNDAM EXTREME VS. MAXIBOOST ON (CUSA15006).
#
# Both titles allocate leaderboard ids at runtime (Ultimate Battle / arcade score boards, ranked
# points), so there is no fixed id list to enumerate here. '*' sets the defaults every board of
# that title inherits the first time the game touches it.
#
# The replay a title attaches to a score is the game-data blob on that board's entry, so
# upload_size_limit is what caps a single replay and upload_num_limit how many a player may keep
# per board. 6 MB x 10 per board per player.
#
# sort_mode is DESCENDING_ORDER (higher score ranks first), which is what a points or damage
# board wants. If a board turns out to rank by time, that board needs its own line with
# ASCENDING_ORDER - a wrong sort mode reverses the whole leaderboard, so confirm against the
# in-game ranking screen before trusting it.
NPWR11246_00|*|100|NORMAL_UPDATE|DESCENDING_ORDER|10|6000000
NPWR17572_00|*|100|NORMAL_UPDATE|DESCENDING_ORDER|10|6000000
