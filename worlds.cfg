# worlds.cfg — matchmaking world layout, per game.
#
# Two sections:
#
# [groups]  maps a title id (CUSAxxxxx, no dash, as the client reports it from
#           param.sfo TITLE_ID) to a shared matching group. Titles in the same
#           group share one room pool / world list (regional or re-release
#           variants of the same game). A title id not listed here keys by its
#           own title id (isolated).
#
# [worlds]  declares the worlds for a group (or for a bare title id used as its
#           own group). Format:
#               GROUP | WORLD_ID | SERVER_ID | LOBBIES_NUM | MAX_LOBBY_MEMBERS
#           Live room / member counts are filled in at request time.
#
# If this file is absent, or a title has no [worlds] rows, GetWorldInfoList
# returns a single default world (worldId=1, lobbiesNum=0). Titles that index a
# fixed world array reject that list with std::out_of_range.
#
# The build copies this file next to shadnet.exe. LoadWorldsCfg reads it from
# the process working directory, which main() sets to the executable directory.

[groups]
# Bloodborne — all regional / re-release SKUs share the "bloodborne" pool.
CUSA00207 = bloodborne
CUSA00208 = bloodborne
CUSA00299 = bloodborne
CUSA00900 = bloodborne
CUSA01363 = bloodborne
CUSA03014 = bloodborne
CUSA03023 = bloodborne
CUSA03173 = bloodborne
CUSA03179 = bloodborne

[worlds]
# group | world_id | server_id | lobbies_num | max_lobby_members
bloodborne | 1 | 1 | 0 | 0

# Bandai Namco netcode (GUNDAM VERSUS / MAXIBOOST ON) walks a fixed ten-slot
# world array after GetWorldInfoList and indexes it by world_id - 1. Returning
# one world (the built-in fallback, or a single-row starter config) still
# throws std::out_of_range. Every group below must declare world ids 1..10.
# server_id must be 1: that is the id the titles request.
#
# lobbies_num stays 0. GVS matches through rooms and never lists lobbies.
# Declaring lobbies for MBON sends it down the lobby path, which currently
# black-screens after login; GetLobbyInfoList itself is fine, the rest of the
# lobby flow is not.
CUSA08379 | 1 | 1 | 0 | 0
CUSA08379 | 2 | 1 | 0 | 0
CUSA08379 | 3 | 1 | 0 | 0
CUSA08379 | 4 | 1 | 0 | 0
CUSA08379 | 5 | 1 | 0 | 0
CUSA08379 | 6 | 1 | 0 | 0
CUSA08379 | 7 | 1 | 0 | 0
CUSA08379 | 8 | 1 | 0 | 0
CUSA08379 | 9 | 1 | 0 | 0
CUSA08379 | 10 | 1 | 0 | 0
CUSA15006 | 1 | 1 | 0 | 0
CUSA15006 | 2 | 1 | 0 | 0
CUSA15006 | 3 | 1 | 0 | 0
CUSA15006 | 4 | 1 | 0 | 0
CUSA15006 | 5 | 1 | 0 | 0
CUSA15006 | 6 | 1 | 0 | 0
CUSA15006 | 7 | 1 | 0 | 0
